{% extends 'base.html' %}
{% set title = titulo %}
{% block content %}
<div class="card narrow center">
  <h1 class="big-code">{{ code }}</h1>
  <h2>{{ titulo }}</h2>
  <p>{{ msg }}</p>
  <p><a class="btn btn-primary" href="{{ url_for('main.inicio') if g.user else url_for('auth.login') }}">Volver al inicio</a></p>
</div>
{% endblock %}
